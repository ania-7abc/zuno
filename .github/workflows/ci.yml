name: Continuous Integration

on:
  push:
    branches:
    - main

  pull_request:
    branches:
    - main

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with: { python-version: "3.12" }

    - name: Install codespell
      run: pip3 install codespell

    - name: Lint
      run: cmake -D FORMAT_COMMAND=clang-format-18 -P cmake/lint.cmake

    - name: Spell check
      if: always()
      run: cmake -P cmake/spell.cmake

  sanitize:
    needs: [lint]

    runs-on: ubuntu-24.04

    env:
      CXX: clang++-18
      CMAKE_PREFIX_PATH: ${{ github.workspace }}/librats-install

    steps:
    - uses: actions/checkout@v4

    - name: Install librats
      shell: pwsh
      run: |
        git clone --depth 1 --branch 3.0.5 https://github.com/librats/librats.git librats
        cmake -S librats -B librats/build `
          -DCMAKE_BUILD_TYPE=Release `
          -DRATS_BUILD_TESTS=OFF `
          -DRATS_BUILD_CLIENT=OFF `
          -DRATS_BUILD_EXAMPLES=OFF
        cmake --build librats/build --config Release -j 2
        cmake --install librats/build --config Release --prefix librats-install

    - name: Configure
      run: cmake --preset=ci-sanitize

    - name: Build
      run: cmake --build build/sanitize -j 2

    - name: Test
      working-directory: build/sanitize
      env:
        ASAN_OPTIONS: "strict_string_checks=1:\
          detect_stack_use_after_return=1:\
          check_initialization_order=1:\
          strict_init_order=1:\
          detect_leaks=1:\
          halt_on_error=1"
        UBSAN_OPTIONS: "print_stacktrace=1:\
          halt_on_error=1"
      run: ctest --output-on-failure --no-tests=error -j 2

  test:
    needs: [lint]

    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]

    runs-on: ${{ matrix.os }}

    env:
      CMAKE_PREFIX_PATH: ${{ github.workspace }}/librats-install

    steps:
    - uses: actions/checkout@v4

    - name: Install librats
      shell: pwsh
      run: |
        git clone --depth 1 --branch 3.0.5 https://github.com/librats/librats.git librats
        cmake -S librats -B librats/build `
          -DCMAKE_BUILD_TYPE=Release `
          -DRATS_BUILD_TESTS=OFF `
          -DRATS_BUILD_CLIENT=OFF `
          -DRATS_BUILD_EXAMPLES=OFF
        cmake --build librats/build --config Release -j 2
        cmake --install librats/build --config Release --prefix librats-install

    - name: Install static analyzers
      if: matrix.os == 'ubuntu-24.04'
      run: >-
        sudo apt-get install clang-tidy-18 cppcheck -y -q

        sudo update-alternatives --install
        /usr/bin/clang-tidy clang-tidy
        /usr/bin/clang-tidy-18 180

    - name: Setup MultiToolTask
      if: matrix.os == 'windows-2022'
      run: |
        Add-Content "$env:GITHUB_ENV" 'UseMultiToolTask=true'
        Add-Content "$env:GITHUB_ENV" 'EnforceProcessCountAcrossBuilds=true'

    - name: Configure
      shell: pwsh
      run: cmake "--preset=ci-$("${{ matrix.os }}".split("-")[0])"

    - name: Build
      run: cmake --build build --config Release -j 2

    - name: Install
      run: cmake --install build --config Release --prefix prefix

    - name: Test
      working-directory: build
      run: ctest --output-on-failure --no-tests=error -C Release -j 2

  docs:
    # Deploy docs only when builds succeed
    needs: [sanitize, test]

    runs-on: ubuntu-24.04

    if: github.event_name == 'push'

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with: { python-version: "3.12" }

    - name: Install m.css dependencies
      run: pip3 install jinja2 Pygments

    - name: Install Doxygen
      run: sudo apt-get update -q
        && sudo apt-get install doxygen -q -y

    - name: Build docs
      run: cmake "-DPROJECT_SOURCE_DIR=$PWD" "-DPROJECT_BINARY_DIR=$PWD/build"
        -P cmake/docs-ci.cmake

    - name: Configure Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: build/docs/html

    - name: Deploy docs
      id: deployment
      uses: actions/deploy-pages@v4

